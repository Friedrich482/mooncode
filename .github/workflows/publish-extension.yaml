name: MoonCode Extension CI/CD Pipeline - Bump and publish extension version

on:
  push:
    branches: "main"
    paths:
      - apps/dashboard/**
      - apps/vscode-extension/**
      - packages/common/**

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Publish
        #  build the dashboard first then the extension
        run: |
          npm run build --workspace=@repo/common
          npm run build --workspace=dashboard
          npm run publish --workspace=mooncode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_LOGOUT_URL: ${{ secrets.VITE_LOGOUT_URL }}
          VITE_AUTH_GOOGLE_URL: ${{ secrets.VITE_AUTH_GOOGLE_URL }}
          VITE_LINKING_GOOGLE_ACCOUNT_URL: ${{ secrets.VITE_LINKING_GOOGLE_ACCOUNT_URL }}
