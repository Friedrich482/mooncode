name: MoonCode CI/CD Pipeline - Build api and web app docker images and deploy to production

on:
  push:
    branches: "main"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint project
        run: npm run lint

      # This step is necessary because @repo/common is a compiled package of the monorepo (https://turborepo.dev/docs/core-concepts/internal-packages#compiled-packages)
      # That package needs to be compiled in order to be consumed by the apps for the testing step
      - name: Build @repo/common package
        run: npm run build -w @repo/common

      - name: Test project
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        include:
          - app: api
            image: mooncode-api
            dockerfile: apps/api/Dockerfile

          - app: web
            image: mooncode-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
