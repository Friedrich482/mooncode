name: mooncode-staging

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - 127.0.0.1:3003:3000
    env_file:
      - apps/api/.env.staging
    depends_on:
      staging-database:
        condition: service_healthy
    container_name: mooncode-api-container
    networks:
      - mooncode-network

  staging-database:
    image: postgres:17-alpine
    container_name: mooncode-database-container
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mooncode-database:/var/lib/postgresql/data
    env_file:
      - apps/api/.env.database
    networks:
      - mooncode-network

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:1.3.0
    container_name: mooncode-drizzle-gateway-container
    restart: always
    env_file:
      - apps/api/.env.gateway
    ports:
      - 127.0.0.1:4997:4983
    depends_on:
      staging-database:
        condition: service_healthy
    volumes:
      - drizzle-gateway:/app
    networks:
      - mooncode-network

volumes:
  mooncode-database:
    name: mooncode-database

  drizzle-gateway:
    name: drizzle-gateway

networks:
  mooncode-network:
    name: mooncode-network
